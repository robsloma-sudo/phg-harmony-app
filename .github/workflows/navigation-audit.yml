name: Navigation audit baseline
on:
  push:
    branches: [fix/mobile-navigation-20260927]
    paths: [.github/workflows/navigation-audit.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a739f56bb511f95d5d6ce9a153aa62e8cbf7a394
          persist-credentials: false
      - name: Package exact git object for local verification
        run: |
          mkdir -p navigation-baseline
          git show HEAD:index.html > navigation-baseline/index.html
          git rev-parse HEAD > navigation-baseline/commit.txt
          git rev-parse HEAD:index.html > navigation-baseline/expected-blob.txt
          git hash-object navigation-baseline/index.html > navigation-baseline/actual-blob.txt
          cmp navigation-baseline/expected-blob.txt navigation-baseline/actual-blob.txt
          git ls-tree -r HEAD > navigation-baseline/tree.txt
          wc -c navigation-baseline/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: phg-navigation-baseline
          path: navigation-baseline/
          retention-days: 2
          if-no-files-found: error
