name: Last Round - Final Narrated Export
on:
  push:
    branches: [media/last-round-narration-mix-20260928]
    paths: [.github/workflows/last-round-audio-mix.yml]
permissions:
  contents: read
concurrency:
  group: last-round-final-audio-mix
  cancel-in-progress: false
jobs:
  mix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      MIX_SOURCES: 
    steps:
      - name: Install media processor only if needed
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Download completed media and mix narration
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,re,subprocess,urllib.request,concurrent.futures,pathlib,zlib,base64
          ROOT=pathlib.Path.cwd(); SRC=ROOT/'mix_sources'; OUT=ROOT/'mix_output'; SRC.mkdir(exist_ok=True); OUT.mkdir(exist_ok=True)
          SOURCES=json.loads(zlib.decompress(base64.b64decode(os.environ['MIX_SOURCES'])).decode())
          for url in SOURCES.values(): print('::add-mask::'+url,flush=True)
          def run(cmd):
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=160)
              if p.returncode: raise RuntimeError('Media processing failed: '+p.stderr[-3500:])
              return p
          def probe(path):
              return json.loads(run(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(path)]).stdout)
          def dur(path): return float(probe(path)['format']['duration'])
          def get_asset(pair):
              name,url=pair
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'PHG-Last-Round-Finalizer/1.0'})
                  with urllib.request.urlopen(req,timeout=90) as response,(SRC/name).open('wb') as target:
                      while True:
                          block=response.read(1024*1024)
                          if not block: break
                          target.write(block)
                  size=(SRC/name).stat().st_size
                  if size<1024: raise ValueError('Media file empty or truncated')
                  print('Downloaded',name,size,'bytes',flush=True)
              except Exception as e:
                  raise RuntimeError('Download failed for '+name+' ('+type(e).__name__+'). No finished video exported.') from None
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool: list(pool.map(get_asset,SOURCES.items()))
          source=SRC/'original_video.mp4'; meta=probe(source)
          if abs(dur(source)-30)>0.15: raise RuntimeError('Source is not the expected 30-second film')
          if not any(s['codec_type']=='audio' for s in meta['streams']): raise RuntimeError('Source soundtrack missing')
          slots=[(0.45,7.5),(7.75,16.6),(17.05,21.2),(24.1,29.8)]
          voices=[]; timing=[]
          for i,(start,end) in enumerate(slots,1):
              trim=SRC/f'trim_{i}.wav'; voice=SRC/f'voice_{i}.wav'
              filters='aresample=48000,highpass=f=70,lowpass=f=12000,silenceremove=start_periods=1:start_duration=0.02:start_threshold=-50dB,areverse,silenceremove=start_periods=1:start_duration=0.02:start_threshold=-50dB,areverse,asetpts=PTS-STARTPTS'
              run(['ffmpeg','-hide_banner','-loglevel','error','-nostdin','-y','-i',str(SRC/f'narration_{i:02d}.mp3'),'-af',filters,'-ac','2','-ar','48000','-c:a','pcm_s24le',str(trim)])
              seconds=dur(trim); speed=max(1.0,seconds/(end-start-0.02))
              if speed>1.18: raise RuntimeError('Narration requires excessive time compression')
              actual=seconds/speed
              af=f'atempo={speed:.9f},aformat=channel_layouts=stereo,loudnorm=I=-17:TP=-2:LRA=7,aresample=48000,afade=t=in:d=0.008,afade=t=out:st={max(0,actual-0.018):.6f}:d=0.018'
              run(['ffmpeg','-hide_banner','-loglevel','error','-nostdin','-y','-i',str(trim),'-af',af,'-ar','48000','-ac','2','-c:a','pcm_s24le',str(voice)])
              voices.append(voice); timing.append({'segment':i,'start':start,'end':round(start+dur(voice),3),'speed':round(speed,5)})
          print('Narration timing:',json.dumps(timing),flush=True)
          inputs=['-i',str(source)]
          for voice in voices: inputs+=['-i',str(voice)]
          segments=[]
          for i,(start,_) in enumerate(slots,1): segments.append(f'[{i}:a]adelay={round(start*1000)}:all=1,apad,atrim=0:30[n{i}]')
          segments.append('[n1][n2][n3][n4]amix=inputs=4:duration=longest:normalize=0,asplit=2[voice_mix][voice_sc]')
          segments.append('[0:a]aresample=48000,aformat=channel_layouts=stereo,volume=0.78[bed]')
          segments.append('[bed][voice_sc]sidechaincompress=threshold=0.03:ratio=4:attack=20:release=300:knee=4:makeup=1[ducked]')
          segments.append('[ducked][voice_mix]amix=inputs=2:duration=first:normalize=0,atrim=0:30,afade=t=out:st=29.94:d=0.06[mix]')
          mix=SRC/'mixed_unmastered.wav'
          run(['ffmpeg','-hide_banner','-loglevel','error','-nostdin','-y',*inputs,'-filter_complex',';'.join(segments),'-map','[mix]','-ar','48000','-ac','2','-c:a','pcm_s24le',str(mix)])
          measure=run(['ffmpeg','-hide_banner','-nostdin','-i',str(mix),'-af','loudnorm=I=-16:TP=-1.5:LRA=9:print_format=json','-f','null','-'])
          blocks=re.findall(r'\{\s*"input_i".*?\}',measure.stderr,re.S)
          if not blocks: raise RuntimeError('Loudness measurements missing')
          m=json.loads(blocks[-1]); filters=f"loudnorm=I=-16:TP=-1.5:LRA=9:measured_I={m['input_i']}:measured_TP={m['input_tp']}:measured_LRA={m['input_lra']}:measured_thresh={m['input_thresh']}:offset={m['target_offset']}:linear=true,aresample=48000"
          final=OUT/'The_Last_Round_Narrated_30s_1080p.mp4'
          run(['ffmpeg','-hide_banner','-loglevel','error','-nostdin','-y','-i',str(source),'-i',str(mix),'-map','0:v:0','-map','1:a:0','-c:v','copy','-af',filters,'-c:a','aac','-b:a','320k','-ar','48000','-ac','2','-t','30','-movflags','+faststart','-metadata','title=The Last Round - Narrated 30-second Promo','-metadata','comment=Original picture and soundtrack with four narration recordings mixed and mastered',str(final)])
          final_meta=probe(final); vd=next(s for s in final_meta['streams'] if s['codec_type']=='video'); au=next(s for s in final_meta['streams'] if s['codec_type']=='audio')
          assert vd['width']==1920 and vd['height']==1080
          assert abs(dur(final)-30)<0.1 and au['codec_name']=='aac' and au['channels']==2
          run(['ffmpeg','-v','error','-nostdin','-i',str(final),'-f','null','-'])
          level=run(['ffmpeg','-hide_banner','-nostdin','-i',str(final),'-af','loudnorm=I=-16:TP=-1.5:LRA=9:print_format=json','-f','null','-'])
          levels=json.loads(re.findall(r'\{\s*"input_i".*?\}',level.stderr,re.S)[-1])
          report={'file':final.name,'duration_seconds':dur(final),'resolution':[vd['width'],vd['height']],'video_codec':vd['codec_name'],'audio_codec':au['codec_name'],'audio_channels':au['channels'],'bytes':final.stat().st_size,'integrated_loudness_LUFS':levels['input_i'],'true_peak_dBTP':levels['input_tp'],'narration_timing':timing,'picture_reencoded':False,'original_music_and_effects':'retained and sidechain-ducked under narration','generated_media_calls':0,'decode_validation':'passed'}
          (OUT/'audio_mix_verification.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2),flush=True)
          PY
      - name: Attach finished narrated MP4
        uses: actions/upload-artifact@v4
        with:
          name: The-Last-Round-Narrated-Final
          path: mix_output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
