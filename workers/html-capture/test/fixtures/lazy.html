<html><head><style>body{font:16px sans-serif;margin:0} .it{padding:14px 40px;border-bottom:1px solid #ddd} h1{padding:40px} .hero{height:700px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:48px}</style></head><body><div class="hero">Cocktails</div><div id="list"></div>
<script>
const L=document.getElementById('list');
for(let i=0;i<8;i++){const d=document.createElement('div');d.className='it';d.style.minHeight='420px';d.dataset.i=i;L.appendChild(d);}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.done){const i=e.target.dataset.i;e.target.dataset.done=1;
 setTimeout(()=>{e.target.innerHTML='<img src="photo'+(i%4)+'.png" width=300 height=300><br><b>Signature Cocktail '+i+'</b> $'+(14+ +i)+'<br><small>vodka, rose syrup, lemon</small>';},150);}}));
document.querySelectorAll('#list .it').forEach(x=>io.observe(x));
</script></body></html>
