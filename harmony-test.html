<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Harmony Test</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0f15;
      color: #f5f7fb;
    }
    main {
      width: min(100%, 560px);
      background: #121823;
      border: 1px solid #283244;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 20px; color: #aab5c6; line-height: 1.45; }
    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 1px solid #344056;
      border-radius: 14px;
      background: #0d131c;
      color: #fff;
      padding: 14px;
      font: inherit;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      padding: 15px 18px;
      font: inherit;
      font-weight: 700;
      font-size: 17px;
      background: #e8edf5;
      color: #10141b;
    }
    button:disabled { opacity: .55; }
    #status { margin-top: 16px; color: #aab5c6; }
    #answer {
      margin-top: 14px;
      padding: 16px;
      border-radius: 14px;
      background: #0d131c;
      border: 1px solid #283244;
      white-space: pre-wrap;
      line-height: 1.5;
      min-height: 56px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Harmony Test</h1>
    <p>This page checks whether the PHG Netlify function can talk to OpenAI.</p>

    <textarea id="message">Hello Harmony</textarea>
    <button id="send">Talk to Harmony</button>

    <div id="status"></div>
    <div id="answer">Waiting for test…</div>
  </main>

  <script>
    const message = document.getElementById("message");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const answer = document.getElementById("answer");

    send.addEventListener("click", async () => {
      const text = message.value.trim();
      if (!text) return;

      send.disabled = true;
      status.textContent = "Talking to Harmony…";
      answer.textContent = "";

      try {
        const response = await fetch("/.netlify/functions/harmony", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.details || data.error || "Request failed");
        }

        answer.textContent = data.answer || "Harmony returned no text.";
        status.textContent = "Success";
      } catch (error) {
        answer.textContent = String(error);
        status.textContent = "Test failed";
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
