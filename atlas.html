<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PHG Atlas · Layers prototype v2</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --bg:#05070d;--panel:rgba(9,14,22,.84);--panel2:rgba(13,20,31,.94);--line:rgba(140,210,230,.14);--line2:rgba(140,210,230,.28);
  --tx:#e8f2f6;--mut:#8ea4b0;--dim:#5d727d;--cy:#22d3ee;--amb:#f5b54a;--vio:#a78bfa;--grn:#34d399;--pink:#ff3d7f;
  --r8:8px;--r12:12px;--r16:16px;--r999:999px;
  --ui:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;--disp:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{background:rgba(9,14,22,.6)!important;color:#8ea4b0!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:#a9c4cf!important}
#fade{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;background-size:cover;transition:opacity .9s var(--ease)}
.glass{background:var(--panel);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line2);box-shadow:0 12px 40px rgba(0,0,0,.35)}
/* top */
.top{position:fixed;top:14px;left:392px;right:70px;display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.ask{flex:1;display:flex;align-items:center;gap:10px;border-radius:var(--r999);padding:6px 6px 6px 12px;min-width:0}
.orb{width:24px;height:24px;border-radius:50%;flex:none;background:conic-gradient(from 0deg,#22d3ee,#a78bfa,#ff3d7f,#f5b54a,#22d3ee);filter:blur(.3px);position:relative;animation:spin 6s linear infinite}
.orb::after{content:"";position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e9feff,#123044 70%)}
.ask.busy .orb{animation-duration:1.1s}
@keyframes spin{to{transform:rotate(360deg)}}
.ask input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font-size:14px}
.ask input::placeholder{color:var(--dim)}
.ask button{border:0;background:linear-gradient(135deg,rgba(34,211,238,.25),rgba(167,139,250,.25));color:#dffaff;border-radius:var(--r999);padding:7px 14px;font-size:12px;font-weight:600}
.tbtn{border-radius:var(--r999);padding:9px 13px;font-size:12px;color:var(--mut);white-space:nowrap;transition:all .2s var(--ease)}
.tbtn:hover{color:var(--tx);transform:translateY(-1px)}
.activebar{position:fixed;top:62px;left:392px;right:70px;z-index:4;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.activebar>*{pointer-events:auto}
.achip{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r999);padding:4px 6px 4px 10px;font-size:11px;animation:pop .35s var(--spring)}
.achip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.achip b{font-weight:500;color:var(--mut)}
.achip button{border:0;background:rgba(255,255,255,.07);width:18px;height:18px;border-radius:50%;font-size:11px;line-height:18px;padding:0;color:var(--mut)}
.achip button:hover{background:rgba(255,61,127,.3);color:#fff}
@keyframes pop{from{transform:scale(.7);opacity:0}}
/* right controls */
.ctrls{position:fixed;right:14px;top:14px;z-index:5;display:flex;flex-direction:column;gap:6px}
.cbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:16px;color:var(--tx);transition:transform .2s var(--spring),background .2s}
.cbtn:hover{transform:scale(1.06)}
.cbtn.on{background:rgba(34,211,238,.22);border-color:rgba(34,211,238,.6);color:#bff6ff}
.cbtn small{font-size:10px;font-weight:700;letter-spacing:.04em}
/* basemap picker */
.bm{position:fixed;right:14px;bottom:14px;z-index:5;border-radius:var(--r16);padding:8px;display:flex;gap:8px;align-items:flex-end}
.bmt{width:66px;border:0;background:none;padding:0;text-align:center;font-size:10.5px;color:var(--mut);transition:transform .25s var(--spring)}
.bmt:hover{transform:translateY(-3px)}
.bmt span{display:block;height:46px;border-radius:10px;margin-bottom:5px;border:2px solid transparent;transition:border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.bmt.on{color:var(--tx)}
.bmt.on span{border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.25)}
.th-mid{background:radial-gradient(circle at 70% 30%,#16324a,#05070d 70%)}
.th-mid::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(35deg,transparent 0 9px,rgba(94,230,240,.18) 9px 10px)}
.th-str{background:#f2efe9}.th-str::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 45%,#fcd986 45% 52%,transparent 52%),linear-gradient(0deg,transparent 60%,#fff 60% 66%,transparent 66%),radial-gradient(circle at 25% 75%,#c8e6b4 0 10px,transparent 11px),linear-gradient(160deg,transparent 70%,#a8cbe8 70%)}
.th-grey{background:#f2f3f3}.th-grey::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,#fff 40% 46%,transparent 46%),linear-gradient(0deg,transparent 30%,#e0e2e3 30% 34%,transparent 34%),linear-gradient(160deg,transparent 72%,#d6dee3 72%)}
.th-green{background:#eceee9}.th-green::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 35%,#b9d9a6 0 13px,transparent 14px),radial-gradient(circle at 78% 70%,#a9cf93 0 10px,transparent 11px),linear-gradient(90deg,transparent 52%,#fff 52% 57%,transparent 57%),linear-gradient(160deg,transparent 75%,#c3d1d8 75%)}
.th-sat{background:radial-gradient(circle at 30% 40%,#4a5d3a,#22301d 40%,#0e1a22 75%)}.th-sat::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,rgba(190,170,130,.5) 0 8px,transparent 9px),radial-gradient(circle at 40% 70%,rgba(120,140,90,.6) 0 12px,transparent 13px)}
.th-blue{background:#0b1d33}.th-blue::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 8px,rgba(120,180,255,.25) 8px 9px),repeating-linear-gradient(90deg,transparent 0 8px,rgba(120,180,255,.25) 8px 9px)}
/* panel */
.panel{position:fixed;top:14px;left:14px;bottom:14px;width:364px;z-index:6;display:flex;flex-direction:column;border-radius:var(--r16);overflow:hidden;transition:transform .45s var(--ease)}
.panel.hide{transform:translateX(calc(-100% - 24px))}
.ph{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.ey{font-family:var(--mono);font-size:10px;letter-spacing:.28em;color:var(--cy)}
.ph h1{font-family:var(--disp);font-weight:400;font-size:26px;margin:4px 0 10px}
.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--r8);padding:7px 10px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);font-size:13px}
.search kbd{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.prow{display:flex;gap:6px;margin-top:10px}
.pbtn{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:var(--r8);padding:7px 0;font-size:12px;color:var(--mut);transition:all .2s var(--ease)}
.pbtn:hover{color:var(--tx);border-color:var(--line2);background:rgba(34,211,238,.07)}
.pbtn:active{transform:scale(.96)}
.presets{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.preset{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:var(--r999);padding:6px 11px;font-size:11px;color:var(--mut);transition:all .2s var(--ease)}
.preset:hover{color:var(--tx);border-color:var(--line2);transform:translateY(-1px)}
.preset.save{color:var(--cy);border-style:dashed}
.pbody{flex:1;overflow-y:auto;padding:8px 8px 40px;scrollbar-width:thin;scrollbar-color:rgba(140,210,230,.2) transparent}
.grp{margin:6px 0;border:1px solid var(--line);border-radius:var(--r12);background:rgba(255,255,255,.015);overflow:hidden}
.grp.prop{border-style:dashed}
.gh{display:flex;align-items:center;gap:10px;padding:11px 10px 11px 12px;cursor:pointer;user-select:none}
.gh:hover{background:rgba(255,255,255,.02)}
.gico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none}
.gt{flex:1;min-width:0}.gt b{display:block;font-size:14px;font-weight:600}
.gt small{display:block;font-size:11px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gacts{display:flex;gap:2px}
.gacts button{border:0;background:none;font-size:10px;color:var(--dim);padding:4px 6px;border-radius:6px;letter-spacing:.04em}
.gacts button:hover{color:var(--cy);background:rgba(34,211,238,.08)}
.car{color:var(--dim);transition:transform .3s var(--ease);font-size:11px;width:14px;text-align:center}
.grp.open>.gh .car{transform:rotate(90deg)}
.gbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.gbody>div{overflow:hidden;padding:0 8px}
.grp.open>.gbody{grid-template-rows:1fr}
.grp.open>.gbody>div{padding-bottom:8px}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;transition:all .25s var(--spring)}
.cb.on{border-color:var(--c,var(--cy));background:var(--c,var(--cy));transform:scale(1.04)}
.cb.on::after{content:"";width:9px;height:5px;border-left:2px solid #05070d;border-bottom:2px solid #05070d;transform:rotate(-45deg) translate(1px,-1px)}
.cb.mix{border-color:var(--c,var(--cy))}.cb.mix::after{content:"";width:8px;height:2px;background:var(--c,var(--cy));border-radius:2px}
.lay{border-radius:var(--r8);margin-top:4px;background:rgba(255,255,255,.02);border:1px solid transparent;transition:background .25s,border-color .25s}
.lay.on{border-color:var(--line);background:rgba(255,255,255,.04)}
.lh{display:flex;align-items:center;gap:9px;padding:9px 8px 9px 10px;cursor:pointer;user-select:none}
.mk{width:22px;height:22px;flex:none;display:grid;place-items:center}
.mk canvas{width:22px;height:22px}
.ln{flex:1;min-width:0}
.ln b{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ln small{display:block;font-size:10.5px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;padding:2px 5px;border-radius:4px;font-weight:600}
.b-live{color:var(--grn);background:rgba(52,211,153,.12)}.b-part{color:var(--amb);background:rgba(245,181,74,.12)}
.b-none{color:var(--dim);background:rgba(255,255,255,.05)}.b-prop{color:var(--vio);background:rgba(167,139,250,.14)}
.lcount{font-family:var(--mono);font-size:10.5px;color:var(--mut)}
.lmore{border:0;background:none;color:var(--dim);font-size:13px;padding:2px 4px;transition:transform .3s var(--ease)}
.lay.exp .lmore{transform:rotate(90deg)}
.lbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.lbody>div{overflow:hidden;padding:0 10px 0 29px}
.lay.exp .lbody{grid-template-rows:1fr}.lay.exp .lbody>div{padding-bottom:12px}
.note{font-size:11px;line-height:1.45;color:var(--mut);background:rgba(245,181,74,.06);border-left:2px solid rgba(245,181,74,.5);padding:7px 9px;border-radius:0 6px 6px 0;margin:4px 0 8px}
.lay.subl{margin-left:16px;border-left:2px solid rgba(34,211,238,.25);border-radius:0 8px 8px 0}
.refine{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--dim);margin:10px 0 2px 18px}
.warn{font-size:11px;color:#ffd08a;background:rgba(245,181,74,.08);border:1px solid rgba(245,181,74,.3);border-radius:8px;padding:6px 8px;margin-top:6px}
.warn a{color:#bff6ff;cursor:pointer;text-decoration:underline}
.chip[disabled]{cursor:not-allowed}
.camimg{width:100%;border-radius:10px;margin-top:8px;background:#000;min-height:120px;object-fit:cover}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:3px;margin:8px 0 10px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:7px 0;border-radius:8px;font-size:12.5px;font-weight:600;transition:all .25s var(--ease)}
.tabs button.on{background:rgba(34,211,238,.16);color:#dffaff}
.tabs button.on[data-tab=layers]{background:rgba(167,139,250,.2);color:#ece6ff}
.secth{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--dim);margin:6px 4px 2px}
.ovc{border:1px solid rgba(167,139,250,.22);background:linear-gradient(180deg,rgba(167,139,250,.06),rgba(167,139,250,.02));border-radius:12px;margin:8px 0;overflow:hidden}
.ovc.on{border-color:rgba(167,139,250,.55);box-shadow:0 0 0 1px rgba(167,139,250,.15) inset}
.ovh{display:flex;align-items:center;gap:10px;padding:10px 10px 6px 10px}
.eye{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.03);display:grid;place-items:center;font-size:15px;color:var(--mut);flex:none;transition:all .25s var(--spring)}
.ovc.on .eye{background:rgba(167,139,250,.28);border-color:rgba(167,139,250,.7);color:#fff}
.ramp{height:6px;border-radius:3px;margin:0 10px 8px 54px}
.ovrow{display:flex;align-items:center;gap:8px;padding:0 10px 10px 54px;font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.ovrow input{flex:1;accent-color:#a78bfa}
.achip.ov{border-style:dashed;border-color:rgba(167,139,250,.5)}
.tp-type{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;padding:3px 8px;border-radius:999px;margin-bottom:6px}
.tp-chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.tp-chip{font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:3px 7px;border-radius:5px;background:rgba(255,255,255,.06);color:var(--mut)}
.tp-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:10px 0 8px}
.tp-tabs button{border:0;background:none;color:var(--mut);font-size:11.5px;padding:7px 8px;border-bottom:2px solid transparent;transition:all .2s}
.tp-tabs button.on{color:var(--tx);border-bottom-color:var(--cy)}
.tp-sec{display:none;animation:pop .3s var(--ease)}.tp-sec.on{display:block}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);position:relative;margin:3px 0 8px}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.kvl{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}.kvl span{color:var(--mut)}
.near{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:8px;cursor:pointer;font-size:12px}.near:hover{background:rgba(255,255,255,.05)}.near i{width:9px;height:9px;border-radius:50%}.near em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--mut)}
body.tp .legend{opacity:0;pointer-events:none;transform:translateY(10px)}
.legend{transition:opacity .3s,transform .3s}
.note.none{background:rgba(255,255,255,.03);border-left-color:var(--dim)}
.f{margin-top:10px}
.fl{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.fl a{font-size:10px;letter-spacing:.04em;text-transform:none;color:var(--dim);cursor:pointer}.fl a:hover{color:var(--cy)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:var(--r999);padding:4px 9px;font-size:11.5px;color:var(--mut);display:inline-flex;gap:6px;align-items:center;transition:all .25s var(--spring)}
.chip:active{transform:scale(.92)}
.chip em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.on{color:#05070d;background:var(--c,var(--cy));border-color:transparent}
.chip.on em{color:rgba(5,7,13,.6)}.chip.on i{box-shadow:0 0 0 1.5px rgba(5,7,13,.6)}
.chip.na{opacity:.45}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r8);overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:6px 4px;font-size:11.5px;color:var(--mut);transition:all .2s}
.seg button.on{background:rgba(34,211,238,.16);color:#bff6ff}
.rng{position:relative;height:26px}
.rng input{position:absolute;inset:0;width:100%;-webkit-appearance:none;appearance:none;background:none;pointer-events:none;margin:0}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:16px;height:16px;border-radius:50%;background:#e8f2f6;border:3px solid var(--c,var(--cy));cursor:pointer;margin-top:-6px;transition:transform .2s var(--spring)}
.rng input::-webkit-slider-thumb:active{transform:scale(1.25)}
.rng input::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:#e8f2f6;border:3px solid var(--c,var(--cy))}
.rng input::-webkit-slider-runnable-track{height:4px;background:transparent}
.rtrack{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:4px;background:rgba(255,255,255,.08)}
.rfill{position:absolute;top:11px;height:4px;border-radius:4px;background:var(--c,var(--cy))}
.rval{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px}
.tog{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:3px 0;cursor:pointer}
.sw2{width:34px;height:20px;border-radius:10px;background:rgba(255,255,255,.1);position:relative;transition:background .25s;flex:none}
.sw2::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#cfdde3;transition:transform .35s var(--spring)}
.sw2.on{background:var(--c,var(--cy))}.sw2.on::after{transform:translateX(14px);background:#05070d}
.sel,.txt{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--r8);color:var(--tx);padding:7px 9px;font-size:12px;outline:0}
.opac{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.opac input{flex:1;accent-color:var(--cy)}
.opac button{border:1px solid var(--line);background:none;border-radius:6px;font-size:10px;color:var(--mut);padding:3px 7px;text-transform:none}
.sub{margin-top:10px;border:1px dashed rgba(34,211,238,.32);border-radius:var(--r8);padding:8px 10px;background:rgba(34,211,238,.03);animation:pop .35s var(--spring)}
.sub .fl{color:var(--cy)}
.hidden{display:none!important}
/* legend & stats */
.legend{position:fixed;right:14px;bottom:106px;z-index:4;border-radius:var(--r12);padding:10px 12px;min-width:200px;max-width:270px;font-size:11.5px;transition:opacity .3s}
.legend h4,.card h4{margin:0 0 6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:var(--mut);font-weight:500}
.lg{display:flex;align-items:center;gap:8px;padding:3px 0}
.lg canvas{width:18px;height:18px;flex:none}
.grad{height:8px;border-radius:4px;margin:4px 0 2px}
.gradl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--mut)}
.stats{position:fixed;left:392px;bottom:14px;z-index:4;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none;max-width:calc(100% - 900px)}
.stat{border-radius:var(--r12);padding:8px 12px;min-width:104px;animation:pop .4s var(--spring)}
.stat b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
/* venue card */
.card{position:fixed;right:70px;top:110px;z-index:6;width:360px;max-height:calc(100vh - 230px);overflow-y:auto;scrollbar-width:thin;border-radius:var(--r16);padding:14px;transform:translateX(30px) scale(.96);opacity:0;pointer-events:none;transition:all .45s var(--spring)}
.card.show{transform:none;opacity:1;pointer-events:auto}
.card .x{position:absolute;right:10px;top:10px;border:0;background:rgba(255,255,255,.07);width:24px;height:24px;border-radius:50%;color:var(--mut)}
.card h3{margin:2px 0 4px;font-family:var(--disp);font-weight:400;font-size:21px}
.card .meta{font-size:12px;color:var(--mut);line-height:1.6}
.card .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.card .kv div{background:rgba(255,255,255,.04);border-radius:8px;padding:7px 9px}
.card .kv b{display:block;font-size:14px}.card .kv span{font-size:9.5px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.card .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card .acts a,.card .acts button{display:block;text-align:center;text-decoration:none;border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:10px;padding:8px 6px;font-size:12px;color:var(--tx);transition:all .2s var(--ease)}
.card .acts a:hover,.card .acts button:hover{background:rgba(34,211,238,.12);transform:translateY(-1px)}
.card .acts .pri{background:linear-gradient(135deg,rgba(34,211,238,.3),rgba(167,139,250,.3));border-color:transparent}
.card .real{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;padding:2px 6px;border-radius:4px;margin-top:6px}
/* tooltip, toast, loader */
.tip{position:fixed;z-index:9;pointer-events:none;border-radius:var(--r8);padding:8px 10px;font-size:11.5px;max-width:240px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.tip.show{opacity:1;transform:none}
.tip b{display:block;font-size:12.5px;margin-bottom:2px}.tip span{color:var(--mut);display:block}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(24px) scale(.96);opacity:0;z-index:10;border-radius:var(--r999);padding:9px 10px 9px 16px;font-size:12.5px;display:flex;gap:12px;align-items:center;transition:all .45s var(--spring);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:rgba(34,211,238,.16);color:#bff6ff;border-radius:var(--r999);padding:5px 11px;font-size:11.5px}
.loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--bg);transition:opacity .8s var(--ease)}
.loader.done{opacity:0;pointer-events:none}
.loader div{text-align:center}.loader .orb{width:54px;height:54px;margin:0 auto 14px}.loader p{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--mut)}
.fab{position:fixed;left:14px;top:14px;z-index:7;display:none;width:44px;height:44px;border-radius:12px;font-size:18px}
.panel.hide~.fab{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:820px){
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;height:52vh;border-radius:18px 18px 0 0}
  .panel.hide{transform:translateY(100%)}
  .top{left:10px;right:62px;top:10px;flex-wrap:wrap;gap:6px}.ask{flex-basis:100%}.tbtn{padding:6px 10px;font-size:11px}
  .activebar{left:10px;right:62px;top:100px}.stats{display:none}.legend{display:none}
  .bm{bottom:auto;top:auto;right:10px;bottom:calc(52vh + 10px);padding:6px;gap:5px}.bmt{width:44px;font-size:9px}.bmt span{height:30px}
  .ctrls{right:10px;top:10px}.cbtn{width:40px;height:40px}
  .card{left:10px;right:10px;width:auto;top:auto;bottom:calc(52vh + 80px)}
}
</style>

  distill:['distilleries','distillery','tequila distilleries'],cams:['cameras','traffic cameras','cams','camera','webcams'],sv:['street view'],census:['census','demographics','census areas'],
  stores:['stores','iowa stores','liquor stores']};
var WXSYN={radar:['radar','precipitation','rain','nexrad','doppler','us radar'],goes:['clouds','cloud','cloud cover','cloud filters','cloud filter','satellite clouds','infrared','goes'],
  alerts:['warnings','alerts','watches','weather warnings','weather alerts','storm warnings','advisories'],lsr:['storm reports','hail reports','tornado reports'],spc:['severe outlook','storm outlook','spc','outlook'],
  trop:['hurricanes','hurricane','tropical storms','tropical'],fires:['fires','fire hotspots','wildfires','fire'],smoke:['smoke','haze'],snow:['snow','snow cover'],lst:['ground temperature','temperature'],
  flood:['floods','flooding','flooded land'],imerg:['rainfall','satellite rainfall'],truecolor:['true colour','true color','satellite photo'],night:['night lights','power outages','outages']};
function findLayer(name){
  var n=String(name||'').toLowerCase().replace(/^(the|my|all the|all)\s+/,'').replace(/\s+(layer|layers|overlay|filters?)$/,'').trim();if(!n)return null;
  var k;for(k in WXSYN){if(WXSYN[k].indexOf(n)>=0&&window.__phgWxApi&&window.__phgWxApi.ids.indexOf(k)>=0)return{wx:k};}
  for(k in SYN){if(SYN[k].indexOf(n)>=0)return{host:k};}
  var hl=hostLayers();for(var i=0;i<hl.length;i++){if(hl[i][1].toLowerCase()===n||hl[i][0]===n)return{host:hl[i][0]};}
  if(window.__phgWxApi){var wn=window.__phgWxApi.names;for(var j=0;j<wn.length;j++){if(wn[j][1].toLowerCase().indexOf(n)===0)return{wx:wn[j][0]};}}
  return null;
}
function layerName(r){if(r.wx){var wn=window.__phgWxApi.names;for(var i=0;i<wn.length;i++)if(wn[i][0]===r.wx)return wn[i][1];}var hl=hostLayers();for(var j=0;j<hl.length;j++)if(hl[j][0]===r.host)return hl[j][1];return r.wx||r.host;}
function setLayer(name,on){
  var r=findLayer(name);if(!r)return{ok:false};
  if(r.wx){window.__phgWxApi.set(r.wx,on);return{ok:true,said:layerName(r)+(on?' on':' off')};}
  try{snap();S[r.host].on=!!on;if(on){var l=L(r.host);if(l&&l.sub&&S.vtype)S.vtype.on=true;}rerender();}catch(e){return{ok:false};}
  return{ok:true,said:layerName(r)+(on?' on':' off')};
}

/* places: the map's own list first, then the US Census 2024 gazetteer (32,333 places) */
var GZ=null,GZP=null;
function gaz(){if(GZ)return Promise.resolve(GZ);if(GZP)return GZP;
  GZP=fetch('/atlas-places.json').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(j){var idx={};
    Object.keys(j.places).forEach(function(st){j.places[st].forEach(function(p){var k=nm(p[0]);(idx[k]=idx[k]||[]).push({n:p[0],st:st,lat:p[1],lng:p[2],w:p[3]});});});GZ={idx:idx,bounds:j.bounds};return GZ;})
   .catch(function(e){GZP=null;throw e;});return GZP;}
function nm(t){return String(t||'').toLowerCase().replace(/^st\.? /,'saint ').replace(/\bst\.? (?=[a-z])/g,'saint ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
var STATES={alabama:'AL',alaska:'AK',arizona:'AZ',arkansas:'AR',california:'CA',colorado:'CO',connecticut:'CT',delaware:'DE','district of columbia':'DC',florida:'FL',georgia:'GA',hawaii:'HI',idaho:'ID',illinois:'IL',indiana:'IN',iowa:'IA',kansas:'KS',kentucky:'KY',louisiana:'LA',maine:'ME',maryland:'MD',massachusetts:'MA',michigan:'MI',minnesota:'MN',mississippi:'MS',missouri:'MO',montana:'MT',nebraska:'NE',nevada:'NV','new hampshire':'NH','new jersey':'NJ','new mexico':'NM','new york state':'NY','north carolina':'NC','north dakota':'ND',ohio:'OH',oklahoma:'OK',oregon:'OR',pennsylvania:'PA','rhode island':'RI','south carolina':'SC','south dakota':'SD',tennessee:'TN',texas:'TX',utah:'UT',vermont:'VT',virginia:'VA','washington state':'WA','west virginia':'WV',wisconsin:'WI',wyoming:'WY','puerto rico':'PR'};
var CODES={};Object.keys(STATES).forEach(function(k){CODES[STATES[k].toLowerCase()]=STATES[k];});
var ALIAS={nyc:'new york NY','new york city':'new york NY',la:'los angeles CA',sf:'san francisco CA',dc:'washington DC','washington dc':'washington DC',vegas:'las vegas NV',philly:'philadelphia PA',nola:'new orleans LA'};
function fly(lng,lat,z){var m=M();m.flyTo({center:[lng,lat],zoom:z,duration:900});}
function place(q){
  var t=nm(q).replace(/^(the )?(city of |town of )/,'');if(!t)return Promise.resolve({ok:false});
  if(ALIAS[t])t=nm(ALIAS[t]);
  if(/^(the )?(whole )?(country|us|usa|united states|lower 48|america)$/.test(t)){fly(-96.5,38.5,3.6);return Promise.resolve({ok:true,said:'United States'});}
  try{if(typeof PLACES==='object'&&PLACES[t]){var p0=PLACES[t];fly(p0[0],p0[1],p0[2]);return Promise.resolve({ok:true,said:t.replace(/\b\w/g,function(c){return c.toUpperCase();})});}}catch(e){}
  return gaz().then(function(P){
    var st=STATES[t]||null;
    if(st){var b=P.bounds[st];if(!b)return{ok:false};M().fitBounds([[b[0],b[1]],[b[2],b[3]]],{padding:30,duration:900,maxZoom:8});return{ok:true,said:t.replace(/\b\w/g,function(c){return c.toUpperCase();})};}
    var city=t,ws=t.split(' ');
    for(var k=2;k>=1&&!st;k--){if(ws.length>k){var tail=ws.slice(-k).join(' '),head=ws.slice(0,-k).join(' ').replace(/ in$/,''),code=CODES[tail]||STATES[tail]||(tail==='washington'?'WA':null)||(tail==='new york'?'NY':null);if(code&&P.idx[head]){city=head;st=code;}}}
    if(!st&&t==='washington'){var bw=P.bounds.WA;M().fitBounds([[bw[0],bw[1]],[bw[2],bw[3]]],{padding:30,duration:900,maxZoom:8});return{ok:true,said:'Washington State'};}
    var c=P.idx[city];if(!c)return{ok:false,said:'No place called "'+q+'"'};
    if(st)c=c.filter(function(p){return p.st===st;});if(!c.length)return{ok:false,said:'No '+city+' in '+st};
    c=c.slice().sort(function(a,b){return b.w-a.w;});
    if(!st&&c.length>1&&c[0].w-c[1].w<0.6){var opts=c.slice(0,6).map(function(p){return p.st;});return{ok:false,ambiguous:opts,said:c[0].n+': which state? '+opts.join(', ')};}
    var p=c[0];fly(p.lng,p.lat,12);return{ok:true,said:p.n+', '+p.st};
  });
}
window.PHGAtlas={
  ready:ready,ack:ack,preload:gaz,
  zoom:function(d){if(!ready())return{ok:false};var m=M();m.easeTo({zoom:Math.max(1,Math.min(19,m.getZoom()+d)),duration:280});return{ok:true,said:d>0?'Zoom in':'Zoom out'};},
  zoomTo:function(z,label){if(!ready())return{ok:false};M().easeTo({zoom:z,duration:400});return{ok:true,said:label||'Zoom '+z};},
  pan:function(dir,amt){if(!ready())return{ok:false};var c=M().getCanvas(),w=c.clientWidth,h=c.clientHeight,f=amt||.4,v={north:[0,-h*f],up:[0,-h*f],south:[0,h*f],down:[0,h*f],east:[w*f,0],right:[w*f,0],west:[-w*f,0],left:[-w*f,0]}[dir];if(!v)return{ok:false};M().panBy(v,{duration:300});return{ok:true,said:'Pan '+dir};},
  reset:function(){if(!ready())return{ok:false};fly(-96.5,38.5,3.6);return{ok:true,said:'Whole country'};},
  layer:function(name,on){if(!ready())return{ok:false};return setLayer(name,on);},
  weatherOff:function(){if(!ready()||!window.__phgWxApi)return{ok:false};window.__phgWxApi.allOff();return{ok:true,said:'Weather off'};},
  base:function(n){if(!ready())return{ok:false};try{if(typeof BASE!=='undefined'&&BASE===n)return{ok:true,said:'Map style unchanged'};setBase(n);}catch(e){return{ok:false};}return{ok:true,said:{midnight:'Midnight map',streets:'Streets map',grey:'Light grey map',green:'Green map',sat:'Satellite map',blueprint:'Blueprint map'}[n]||n};},
  place:function(q){if(!ready())return Promise.resolve({ok:false});return place(q);},
  /* everything else: the Atlas's own Ask Harmony parsers (venues, income, tequila, weather dates, events…) */
  ask:function(text){if(!ready())return{ok:false};var el=document.getElementById('ask');if(!el)return{ok:false};
    var before=hostState(),wxChanged=false;el.value=String(text||'');
    try{ask();}catch(e){}
    try{if(window.__phgWxApi)wxChanged=window.__phgWxApi.ask();}catch(e){}
    var changed=wxChanged||hostState()!==before;el.value='';
    return{ok:changed,said:changed?'Done':''};}
};
})();
